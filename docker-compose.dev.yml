# Endast för lokal dev/test - INTE drift-vägen (Unraid = Add Container, se README).
# Kör shimmen + en scopad socket-proxy mot VM:ens egna docker.
services:
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    environment:
      # Minsta rättigheter för att skapa+starta containrar och pulla images.
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      # Allt annat explicit av.
      INFO: 1        # /version för health-ping
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
      AUTH: 0
      SECRETS: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      PLUGINS: 0
      TASKS: 0
      NODES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  dockyard:
    build: .
    depends_on:
      - socket-proxy
    environment:
      API_KEY: ${API_KEY}
      DOCKER_HOST: tcp://socket-proxy:2375
      # Lokalt testar vi utan template-skrivning (ingen /boot på VM:en).
      WRITE_TEMPLATE: "false"
      ALLOWED_NAME_PREFIXES: ${ALLOWED_NAME_PREFIXES:-dockyard-test-}
    ports:
      - "${HOST_PORT:-8001}:8000"
    restart: unless-stopped
